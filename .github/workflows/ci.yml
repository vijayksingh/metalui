name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run typecheck
      - run: npm run verify:package
      - run: npm run verify:types
      - run: npm run bench:bundle:gate

  # Idle counters (running loops, layouts and style recalcs per second at rest) do not depend on how busy the
  # runner is, so they gate here. Durations are only ever published from the benchmark machine (bench/run.sh).
  # continue-on-error until it has run green on GitHub once; then drop it and the gate is hard.
  idle:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: BENCH_PAGES=all npx playwright test -c bench/playwright.config.ts --workers=3
      - run: npm run bench:gate

  # The feature slices against the real docs site. Non-blocking until it has proven stable on GitHub's runners
  # (fonts and timing differ from a Mac); it uploads the report when it fails.
  e2e:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e -- --workers=2 --retries=1
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7

  swift:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - run: swift build
