<svg xmlns="http://www.w3.org/2000/svg" class="mu-life mu-il-bug" width="24" height="24" viewBox="0 0 24 24">
<!-- MetalUI life icon: Bug. Hover (or data-state="hover"): legs scuttle. Reduced motion: static. -->
<style>
.mu-life{--sw:1.7;--k-spring:linear(0,0.0132,0.0492,0.1028,0.1692,0.2443,0.3247,0.4071,0.4892,0.5688,0.6445,0.715,0.7795,0.8374,0.8886,0.933,0.9707,1.0021,1.0274,1.0473,1.0623,1.0728,1.0795,1.0828,1.0835,1.0818,1.0784,1.0736,1.0679,1.0614,1.0547,1.0478,1.041,1.0344,1.0282,1.0224,1.0171,1.0124,1.0083,1.0047,1.0017,0.9992,0.9972,0.9957,1);--k-dur:.5s;flex:none;overflow:visible;fill:none;stroke:currentColor;stroke-width:var(--sw);stroke-linecap:round;stroke-linejoin:round}
.mu-life *{transform-box:view-box}
.mu-life .f{fill:currentColor;fill-opacity:calc(var(--duo,.14) * var(--mu-duo-k,1))}
.mu-life .s{fill:currentColor;stroke:none}
.mu-life .d{fill:currentColor;fill-opacity:calc(var(--duo,.14) * var(--mu-duo-k,1));stroke:none}
@media (prefers-reduced-motion:no-preference){
.mu-life *{transition:transform var(--k-dur) var(--k-spring) var(--dl,0s),opacity .22s ease var(--dl,0s),fill-opacity .25s ease}
}
svg.mu-life .lL{transform-origin:7.4px 14.6px} svg.mu-life .lR{transform-origin:16.6px 14.6px}
@media (prefers-reduced-motion:no-preference){svg.mu-life:is(:hover,[data-state~="hover"]) .lL{animation:mu-il-bug .18s linear 3} svg.mu-life:is(:hover,[data-state~="hover"]) .lR{animation:mu-il-bug2 .18s linear 3} @keyframes mu-il-bug{50%{transform:rotate(8deg)}} @keyframes mu-il-bug2{50%{transform:rotate(-8deg)}}}</style>
<ellipse class="f" style="--duo:.14" cx="12" cy="13.8" rx="4.6" ry="5.8"/><path d="M9.6 8.6a2.4 2.4 0 0 1 4.8 0"/><path d="M12 10.8v8.6" style="opacity:.5"/><path d="M10.2 6.6 8.8 4.8M13.8 6.6l1.4-1.8"/><g class="lL"><path d="M7.4 11.6 4.6 10.4M7.4 14.6H4.2M7.8 17.4l-2.6 1.6"/></g><g class="lR"><path d="M16.6 11.6l2.8-1.2M16.6 14.6h3.2M16.2 17.4l2.6 1.6"/></g>
</svg>
