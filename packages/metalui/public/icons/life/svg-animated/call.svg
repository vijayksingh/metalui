.mu-life .s{fill:currentColor;stroke:none}
.mu-life .d{fill:currentColor;fill-opacity:calc(var(--duo,.14) * var(--mu-duo-k,1));stroke:none}
@media (prefers-reduced-motion:no-preference){
.mu-life *{transition:transform var(--k-dur) var(--k-spring) var(--dl,0s),opacity .22s ease var(--dl,0s),fill-opacity .25s ease}
}
svg.mu-life .hs{transform-origin:9px 14px} svg.mu-life .sg2{--dl:.1s}
@media (prefers-reduced-motion:no-preference){svg.mu-life:is(:hover,[data-state~="hover"]) .hs{animation:mu-il-call .6s linear} svg.mu-life:is(:hover,[data-state~="hover"]) .sg1,svg.mu-life:is(:hover,[data-state~="hover"]) .sg2{animation:mu-il-call2 .6s cubic-bezier(.3,0,.2,1) var(--dl)} @keyframes mu-il-call{15%,55%{transform:rotate(6deg)}35%,75%{transform:rotate(-6deg)}100%{transform:none}} @keyframes mu-il-call2{40%{opacity:.2}}}</style>
