<svg xmlns="http://www.w3.org/2000/svg" class="mu-life mu-il-coffee" width="24" height="24" viewBox="0 0 24 24">
<!-- MetalUI life icon: Coffee. Hover (or data-state="hover"): steam rises from the cup. Reduced motion: static. -->
<style>
.mu-life{--sw:1.7;--k-spring:linear(0,0.0132,0.0492,0.1028,0.1692,0.2443,0.3247,0.4071,0.4892,0.5688,0.6445,0.715,0.7795,0.8374,0.8886,0.933,0.9707,1.0021,1.0274,1.0473,1.0623,1.0728,1.0795,1.0828,1.0835,1.0818,1.0784,1.0736,1.0679,1.0614,1.0547,1.0478,1.041,1.0344,1.0282,1.0224,1.0171,1.0124,1.0083,1.0047,1.0017,0.9992,0.9972,0.9957,1);--k-dur:.5s;flex:none;overflow:visible;fill:none;stroke:currentColor;stroke-width:var(--sw);stroke-linecap:round;stroke-linejoin:round}
.mu-life *{transform-box:view-box}
.mu-life .f{fill:currentColor;fill-opacity:calc(var(--duo,.14) * var(--mu-duo-k,1))}
.mu-life .s{fill:currentColor;stroke:none}
.mu-life .d{fill:currentColor;fill-opacity:calc(var(--duo,.14) * var(--mu-duo-k,1));stroke:none}
@media (prefers-reduced-motion:no-preference){
.mu-life *{transition:transform var(--k-dur) var(--k-spring) var(--dl,0s),opacity .22s ease var(--dl,0s),fill-opacity .25s ease}
}
svg.mu-life .s2{--dl:.12s}
@media (prefers-reduced-motion:no-preference){svg.mu-life:is(:hover,[data-state~="hover"]) .st{animation:mu-il-coffee 1.1s cubic-bezier(.4,0,.4,1) var(--dl,0s) 2} @keyframes mu-il-coffee{0%{transform:none;opacity:1}55%{transform:translateY(-2.2px);opacity:0}56%{transform:translateY(1.2px);opacity:0}100%{transform:none;opacity:1}}}</style>
<path class="f" style="--duo:.14" d="M4.8 9.4h10.6v6a4.2 4.2 0 0 1-4.2 4.2H9a4.2 4.2 0 0 1-4.2-4.2Z"/><path d="M15.4 10.8h1.2a2.5 2.5 0 0 1 0 5h-1.2"/><path class="st s1" d="M8.6 6.9c-.9-.9.9-1.8 0-2.8"/><path class="st s2" d="M11.8 6.9c-.9-.9.9-1.8 0-2.8"/>
</svg>
