<svg xmlns="http://www.w3.org/2000/svg" class="mu-life mu-il-cooking" width="24" height="24" viewBox="0 0 24 24">
<!-- MetalUI life icon: Cooking. Hover (or data-state="hover"): lid lifts, steam escapes. Reduced motion: static. -->
<style>
.mu-life{--sw:1.7;--k-spring:linear(0,0.0132,0.0492,0.1028,0.1692,0.2443,0.3247,0.4071,0.4892,0.5688,0.6445,0.715,0.7795,0.8374,0.8886,0.933,0.9707,1.0021,1.0274,1.0473,1.0623,1.0728,1.0795,1.0828,1.0835,1.0818,1.0784,1.0736,1.0679,1.0614,1.0547,1.0478,1.041,1.0344,1.0282,1.0224,1.0171,1.0124,1.0083,1.0047,1.0017,0.9992,0.9972,0.9957,1);--k-dur:.5s;flex:none;overflow:visible;fill:none;stroke:currentColor;stroke-width:var(--sw);stroke-linecap:round;stroke-linejoin:round}
.mu-life *{transform-box:view-box}
.mu-life .f{fill:currentColor;fill-opacity:calc(var(--duo,.14) * var(--mu-duo-k,1))}
.mu-life .s{fill:currentColor;stroke:none}
.mu-life .d{fill:currentColor;fill-opacity:calc(var(--duo,.14) * var(--mu-duo-k,1));stroke:none}
@media (prefers-reduced-motion:no-preference){
.mu-life *{transition:transform var(--k-dur) var(--k-spring) var(--dl,0s),opacity .22s ease var(--dl,0s),fill-opacity .25s ease}
}
svg.mu-life .ld{transform-origin:4.6px 8.4px} svg.mu-life .pf{opacity:0}
@media (prefers-reduced-motion:no-preference){svg.mu-life:is(:hover,[data-state~="hover"]) .ld{transform:translateY(-1.5px) rotate(-7deg)} svg.mu-life:is(:hover,[data-state~="hover"]) .pf{animation:mu-il-cooking .9s cubic-bezier(.3,0,.2,1) .1s} @keyframes mu-il-cooking{0%{opacity:0;transform:translateY(1.4px)}40%{opacity:1}100%{opacity:0;transform:translateY(-1.6px)}}}</style>
<path class="f" style="--duo:.12" d="M5.4 10.6h13.2v6a3 3 0 0 1-3 3H8.4a3 3 0 0 1-3-3Z"/><path d="M5.4 12.6H3.6M18.6 12.6h1.8"/><g class="ld"><path d="M4.6 8.4h14.8"/><path d="M10.6 8.4a1.4 1.4 0 0 1 2.8 0"/></g><path class="pf" d="M8.4 5.6c-.7-.7.7-1.4 0-2.2M15.6 5.6c-.7-.7.7-1.4 0-2.2"/>
</svg>
