<svg xmlns="http://www.w3.org/2000/svg" class="mu-life mu-il-errands" width="24" height="24" viewBox="0 0 24 24">
<!-- MetalUI life icon: Errands. Hover (or data-state="hover"): the route runs to the pin. Reduced motion: static. -->
<style>
.mu-life{--sw:1.7;--k-spring:linear(0,0.0132,0.0492,0.1028,0.1692,0.2443,0.3247,0.4071,0.4892,0.5688,0.6445,0.715,0.7795,0.8374,0.8886,0.933,0.9707,1.0021,1.0274,1.0473,1.0623,1.0728,1.0795,1.0828,1.0835,1.0818,1.0784,1.0736,1.0679,1.0614,1.0547,1.0478,1.041,1.0344,1.0282,1.0224,1.0171,1.0124,1.0083,1.0047,1.0017,0.9992,0.9972,0.9957,1);--k-dur:.5s;flex:none;overflow:visible;fill:none;stroke:currentColor;stroke-width:var(--sw);stroke-linecap:round;stroke-linejoin:round}
.mu-life *{transform-box:view-box}
.mu-life .f{fill:currentColor;fill-opacity:calc(var(--duo,.14) * var(--mu-duo-k,1))}
.mu-life .s{fill:currentColor;stroke:none}
.mu-life .d{fill:currentColor;fill-opacity:calc(var(--duo,.14) * var(--mu-duo-k,1));stroke:none}
@media (prefers-reduced-motion:no-preference){
.mu-life *{transition:transform var(--k-dur) var(--k-spring) var(--dl,0s),opacity .22s ease var(--dl,0s),fill-opacity .25s ease}
}
@media (prefers-reduced-motion:no-preference){svg.mu-life:is(:hover,[data-state~="hover"]) .rt{animation:mu-il-errands .8s linear} svg.mu-life:is(:hover,[data-state~="hover"]) .pn{animation:mu-il-errands2 .6s cubic-bezier(.3,0,.2,1) .2s} @keyframes mu-il-errands{to{stroke-dashoffset:-5.8}} @keyframes mu-il-errands2{40%{transform:translateY(-1.2px)}}}</style>
<path class="rt" d="M6.4 16.4c0-2.8 2.6-3.6 5.4-3.6s5.8-.6 5.8-3" style="stroke-dasharray:.01 2.9"/><circle class="f" style="--duo:.2" cx="6.4" cy="18" r="1.8"/><g class="pn"><path class="f" style="--duo:.2" d="M17.6 10.2c-2-2.1-3.4-3.6-3.4-5.4a3.4 3.4 0 0 1 6.8 0c0 1.8-1.4 3.3-3.4 5.4Z"/><circle class="s" cx="17.6" cy="4.8" r="1"/></g>
</svg>
