<svg xmlns="http://www.w3.org/2000/svg" class="mu-life mu-il-grateful" width="24" height="24" viewBox="0 0 24 24">
<!-- MetalUI life icon: Grateful. Hover (or data-state="hover"): a drop lands in the full vessel. Reduced motion: static. -->
<style>
.mu-life{--sw:1.7;--k-spring:linear(0,0.0132,0.0492,0.1028,0.1692,0.2443,0.3247,0.4071,0.4892,0.5688,0.6445,0.715,0.7795,0.8374,0.8886,0.933,0.9707,1.0021,1.0274,1.0473,1.0623,1.0728,1.0795,1.0828,1.0835,1.0818,1.0784,1.0736,1.0679,1.0614,1.0547,1.0478,1.041,1.0344,1.0282,1.0224,1.0171,1.0124,1.0083,1.0047,1.0017,0.9992,0.9972,0.9957,1);--k-dur:.5s;flex:none;overflow:visible;fill:none;stroke:currentColor;stroke-width:var(--sw);stroke-linecap:round;stroke-linejoin:round}
.mu-life *{transform-box:view-box}
.mu-life .f{fill:currentColor;fill-opacity:calc(var(--duo,.14) * var(--mu-duo-k,1))}
.mu-life .s{fill:currentColor;stroke:none}
.mu-life .d{fill:currentColor;fill-opacity:calc(var(--duo,.14) * var(--mu-duo-k,1));stroke:none}
@media (prefers-reduced-motion:no-preference){
.mu-life *{transition:transform var(--k-dur) var(--k-spring) var(--dl,0s),opacity .22s ease var(--dl,0s),fill-opacity .25s ease}
}
svg.mu-life .sf{transform-origin:12px 11.8px} svg.mu-life .dp{opacity:0}
@media (prefers-reduced-motion:no-preference){svg.mu-life:is(:hover,[data-state~="hover"]) .dp{animation:mu-il-grateful .8s cubic-bezier(.5,0,.8,.6)} svg.mu-life:is(:hover,[data-state~="hover"]) .sf{animation:mu-il-grateful2 .8s cubic-bezier(.3,0,.2,1)} @keyframes mu-il-grateful{0%{transform:translateY(-1px);opacity:1}60%{transform:translateY(5px);opacity:1}61%{opacity:0}100%{opacity:0}} @keyframes mu-il-grateful2{55%{transform:none}70%{transform:scaleX(.8)}100%{transform:none}}}</style>
<defs><clipPath id="mu-life-grateful-in"><circle cx="12" cy="12" r="9.3"/></clipPath></defs><circle class="v d" style="--duo:0.1" cx="12" cy="12" r="9.3"/><g clip-path="url(#mu-life-grateful-in)"><path class="d" style="--duo:.3" d="M2 11.8h20V22H2Z"/></g><path class="sf" d="M5.4 11.8c0.79 -0.47 1.41 -0.47 2.2 0c0.79 0.47 1.41 0.47 2.2 0c0.79 -0.47 1.41 -0.47 2.2 0c0.79 0.47 1.41 0.47 2.2 0c0.79 -0.47 1.41 -0.47 2.2 0c0.79 0.47 1.41 0.47 2.2 0"/><circle class="dp s" cx="12" cy="6.4" r="1.2"/>
</svg>
