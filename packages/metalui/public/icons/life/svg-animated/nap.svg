@media (prefers-reduced-motion:no-preference){svg.mu-life:is(:hover,[data-state~="hover"]) .mn{transform:rotate(-8deg)} svg.mu-life:is(:hover,[data-state~="hover"]) .z{animation:mu-il-nap 1.2s cubic-bezier(.4,0,.4,1)} @keyframes mu-il-nap{0%{transform:none;opacity:1}50%{transform:translate(1px,-2.4px);opacity:0}51%{transform:translate(-1px,1.2px);opacity:0}100%{transform:none;opacity:1}}}</style>
