<svg xmlns="http://www.w3.org/2000/svg" class="mu-life mu-il-nap" width="24" height="24" viewBox="0 0 24 24">
<!-- MetalUI life icon: Nap. Hover (or data-state="hover"): a z drifts up. Reduced motion: static. -->
