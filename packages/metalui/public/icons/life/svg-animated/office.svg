<svg xmlns="http://www.w3.org/2000/svg" class="mu-life mu-il-office" width="24" height="24" viewBox="0 0 24 24">
<!-- MetalUI life icon: Office. Hover (or data-state="hover"): windows light in turn. Reduced motion: static. -->
<style>
.mu-life{--sw:1.7;--k-spring:linear(0,0.0132,0.0492,0.1028,0.1692,0.2443,0.3247,0.4071,0.4892,0.5688,0.6445,0.715,0.7795,0.8374,0.8886,0.933,0.9707,1.0021,1.0274,1.0473,1.0623,1.0728,1.0795,1.0828,1.0835,1.0818,1.0784,1.0736,1.0679,1.0614,1.0547,1.0478,1.041,1.0344,1.0282,1.0224,1.0171,1.0124,1.0083,1.0047,1.0017,0.9992,0.9972,0.9957,1);--k-dur:.5s;flex:none;overflow:visible;fill:none;stroke:currentColor;stroke-width:var(--sw);stroke-linecap:round;stroke-linejoin:round}
.mu-life *{transform-box:view-box}
.mu-life .f{fill:currentColor;fill-opacity:calc(var(--duo,.14) * var(--mu-duo-k,1))}
.mu-life .s{fill:currentColor;stroke:none}
.mu-life .d{fill:currentColor;fill-opacity:calc(var(--duo,.14) * var(--mu-duo-k,1));stroke:none}
@media (prefers-reduced-motion:no-preference){
.mu-life *{transition:transform var(--k-dur) var(--k-spring) var(--dl,0s),opacity .22s ease var(--dl,0s),fill-opacity .25s ease}
}
svg.mu-life .w2{--dl:.08s} svg.mu-life .w3{--dl:.16s} svg.mu-life .w4{--dl:.24s}
@media (prefers-reduced-motion:no-preference){svg.mu-life:is(:hover,[data-state~="hover"]) .w{animation:mu-il-office .5s ease var(--dl) both} @keyframes mu-il-office{0%{fill-opacity:.15}100%{fill-opacity:1}}}</style>
<rect class="f" style="--duo:.05" x="5.4" y="3.4" width="13.2" height="17" rx="2.2"/><rect class="w w1 d" style="--duo:.5" x="8.4" y="6.6" width="2.4" height="2.4" rx=".7"/><rect class="w w2 d" style="--duo:.5" x="13.2" y="6.6" width="2.4" height="2.4" rx=".7"/><rect class="w w3 d" style="--duo:.5" x="8.4" y="11" width="2.4" height="2.4" rx=".7"/><rect class="w w4 d" style="--duo:.5" x="13.2" y="11" width="2.4" height="2.4" rx=".7"/><path d="M10.6 20.4v-3.2h2.8v3.2"/>
</svg>
