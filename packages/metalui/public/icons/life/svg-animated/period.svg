<svg xmlns="http://www.w3.org/2000/svg" class="mu-life mu-il-period" width="24" height="24" viewBox="0 0 24 24">
<!-- MetalUI life icon: Period. Hover (or data-state="hover"): the cycle ring turns a day. Reduced motion: static. -->
<style>
.mu-life{--sw:1.7;--k-spring:linear(0,0.0132,0.0492,0.1028,0.1692,0.2443,0.3247,0.4071,0.4892,0.5688,0.6445,0.715,0.7795,0.8374,0.8886,0.933,0.9707,1.0021,1.0274,1.0473,1.0623,1.0728,1.0795,1.0828,1.0835,1.0818,1.0784,1.0736,1.0679,1.0614,1.0547,1.0478,1.041,1.0344,1.0282,1.0224,1.0171,1.0124,1.0083,1.0047,1.0017,0.9992,0.9972,0.9957,1);--k-dur:.5s;flex:none;overflow:visible;fill:none;stroke:currentColor;stroke-width:var(--sw);stroke-linecap:round;stroke-linejoin:round}
.mu-life *{transform-box:view-box}
.mu-life .f{fill:currentColor;fill-opacity:calc(var(--duo,.14) * var(--mu-duo-k,1))}
.mu-life .s{fill:currentColor;stroke:none}
.mu-life .d{fill:currentColor;fill-opacity:calc(var(--duo,.14) * var(--mu-duo-k,1));stroke:none}
@media (prefers-reduced-motion:no-preference){
.mu-life *{transition:transform var(--k-dur) var(--k-spring) var(--dl,0s),opacity .22s ease var(--dl,0s),fill-opacity .25s ease}
}
svg.mu-life .rg{transform-origin:12px 12px}
@media (prefers-reduced-motion:no-preference){svg.mu-life:is(:hover,[data-state~="hover"]) .rg{transform:rotate(36deg)}}</style>
<path class="f" style="--duo:.26" d="M12 6.6c2.4 2.8 3.8 4.8 3.8 6.8a3.8 3.8 0 0 1-7.6 0c0-2 1.4-4 3.8-6.8Z"/><g class="rg"><circle class="s" cx="12" cy="3.4" r="1.2"/><circle class="s" cx="17.05" cy="5.04" r="0.75" style="opacity:.55"/><circle class="s" cx="20.18" cy="9.34" r="0.75" style="opacity:.55"/><circle class="s" cx="20.18" cy="14.66" r="0.75" style="opacity:.55"/><circle class="s" cx="17.05" cy="18.96" r="0.75" style="opacity:.55"/><circle class="s" cx="12" cy="20.6" r="0.75" style="opacity:.55"/><circle class="s" cx="6.95" cy="18.96" r="0.75" style="opacity:.55"/><circle class="s" cx="3.82" cy="14.66" r="0.75" style="opacity:.55"/><circle class="s" cx="3.82" cy="9.34" r="0.75" style="opacity:.55"/><circle class="s" cx="6.95" cy="5.04" r="0.75" style="opacity:.55"/></g>
</svg>
