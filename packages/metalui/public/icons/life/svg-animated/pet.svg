<svg xmlns="http://www.w3.org/2000/svg" class="mu-life mu-il-pet" width="24" height="24" viewBox="0 0 24 24">
<!-- MetalUI life icon: Pet. Hover (or data-state="hover"): the paw presses. Reduced motion: static. -->
<style>
.mu-life{--sw:1.7;--k-spring:linear(0,0.0132,0.0492,0.1028,0.1692,0.2443,0.3247,0.4071,0.4892,0.5688,0.6445,0.715,0.7795,0.8374,0.8886,0.933,0.9707,1.0021,1.0274,1.0473,1.0623,1.0728,1.0795,1.0828,1.0835,1.0818,1.0784,1.0736,1.0679,1.0614,1.0547,1.0478,1.041,1.0344,1.0282,1.0224,1.0171,1.0124,1.0083,1.0047,1.0017,0.9992,0.9972,0.9957,1);--k-dur:.5s;flex:none;overflow:visible;fill:none;stroke:currentColor;stroke-width:var(--sw);stroke-linecap:round;stroke-linejoin:round}
.mu-life *{transform-box:view-box}
.mu-life .f{fill:currentColor;fill-opacity:calc(var(--duo,.14) * var(--mu-duo-k,1))}
.mu-life .s{fill:currentColor;stroke:none}
.mu-life .d{fill:currentColor;fill-opacity:calc(var(--duo,.14) * var(--mu-duo-k,1));stroke:none}
@media (prefers-reduced-motion:no-preference){
.mu-life *{transition:transform var(--k-dur) var(--k-spring) var(--dl,0s),opacity .22s ease var(--dl,0s),fill-opacity .25s ease}
}
svg.mu-life .pw{transform-origin:12px 19px}
@media (prefers-reduced-motion:no-preference){svg.mu-life:is(:hover,[data-state~="hover"]) .pw{animation:mu-il-pet .45s cubic-bezier(.3,0,.2,1)} @keyframes mu-il-pet{40%{transform:scale(.9)}}}</style>
<g class="pw"><path class="f" style="--duo:.2" d="M12 12c2.6 0 4.8 2.4 4.8 4.6 0 1.6-1.2 2.6-2.6 2.6-.9 0-1.4-.4-2.2-.4s-1.3.4-2.2.4c-1.4 0-2.6-1-2.6-2.6 0-2.2 2.2-4.6 4.8-4.6Z"/><ellipse class="s" cx="6.4" cy="10.2" rx="1.5" ry="1.9" transform="rotate(-24 6.4 10.2)"/><ellipse class="s" cx="9.6" cy="6.6" rx="1.6" ry="2.1" transform="rotate(-8 9.6 6.6)"/><ellipse class="s" cx="14.4" cy="6.6" rx="1.6" ry="2.1" transform="rotate(8 14.4 6.6)"/><ellipse class="s" cx="17.6" cy="10.2" rx="1.5" ry="1.9" transform="rotate(24 17.6 10.2)"/></g>
</svg>
