<svg xmlns="http://www.w3.org/2000/svg" class="mu-life mu-il-photo" width="24" height="24" viewBox="0 0 24 24">
<!-- MetalUI life icon: Photo. Hover (or data-state="hover"): lens focuses, flash blinks. Reduced motion: static. -->
<style>
.mu-life{--sw:1.7;--k-spring:linear(0,0.0132,0.0492,0.1028,0.1692,0.2443,0.3247,0.4071,0.4892,0.5688,0.6445,0.715,0.7795,0.8374,0.8886,0.933,0.9707,1.0021,1.0274,1.0473,1.0623,1.0728,1.0795,1.0828,1.0835,1.0818,1.0784,1.0736,1.0679,1.0614,1.0547,1.0478,1.041,1.0344,1.0282,1.0224,1.0171,1.0124,1.0083,1.0047,1.0017,0.9992,0.9972,0.9957,1);--k-dur:.5s;flex:none;overflow:visible;fill:none;stroke:currentColor;stroke-width:var(--sw);stroke-linecap:round;stroke-linejoin:round}
.mu-life *{transform-box:view-box}
.mu-life .f{fill:currentColor;fill-opacity:calc(var(--duo,.14) * var(--mu-duo-k,1))}
.mu-life .s{fill:currentColor;stroke:none}
.mu-life .d{fill:currentColor;fill-opacity:calc(var(--duo,.14) * var(--mu-duo-k,1));stroke:none}
@media (prefers-reduced-motion:no-preference){
.mu-life *{transition:transform var(--k-dur) var(--k-spring) var(--dl,0s),opacity .22s ease var(--dl,0s),fill-opacity .25s ease}
}
svg.mu-life .ln{transform-origin:12px 13.2px}
@media (prefers-reduced-motion:no-preference){svg.mu-life:is(:hover,[data-state~="hover"]) .ln{animation:mu-il-photo .5s cubic-bezier(.3,0,.2,1)} svg.mu-life:is(:hover,[data-state~="hover"]) .fl{animation:mu-il-photo2 .4s steps(1)} @keyframes mu-il-photo{40%{transform:scale(.82)}} @keyframes mu-il-photo2{50%{opacity:.2}}}</style>
<path class="f" style="--duo:.08" d="M3.4 9.4a2.2 2.2 0 0 1 2.2-2.2h2.2l1.4-2.2h5.6l1.4 2.2h2.2a2.2 2.2 0 0 1 2.2 2.2v8.4a2.2 2.2 0 0 1-2.2 2.2H5.6a2.2 2.2 0 0 1-2.2-2.2Z"/><circle class="ln" cx="12" cy="13.2" r="3.6"/><circle class="fl s" cx="17.4" cy="10" r=".85"/>
</svg>
