<svg xmlns="http://www.w3.org/2000/svg" class="mu-life mu-il-plants" width="24" height="24" viewBox="0 0 24 24">
<!-- MetalUI life icon: Plants. Hover (or data-state="hover"): leaves sway. Reduced motion: static. -->
<style>
.mu-life{--sw:1.7;--k-spring:linear(0,0.0132,0.0492,0.1028,0.1692,0.2443,0.3247,0.4071,0.4892,0.5688,0.6445,0.715,0.7795,0.8374,0.8886,0.933,0.9707,1.0021,1.0274,1.0473,1.0623,1.0728,1.0795,1.0828,1.0835,1.0818,1.0784,1.0736,1.0679,1.0614,1.0547,1.0478,1.041,1.0344,1.0282,1.0224,1.0171,1.0124,1.0083,1.0047,1.0017,0.9992,0.9972,0.9957,1);--k-dur:.5s;flex:none;overflow:visible;fill:none;stroke:currentColor;stroke-width:var(--sw);stroke-linecap:round;stroke-linejoin:round}
.mu-life *{transform-box:view-box}
.mu-life .f{fill:currentColor;fill-opacity:calc(var(--duo,.14) * var(--mu-duo-k,1))}
.mu-life .s{fill:currentColor;stroke:none}
.mu-life .d{fill:currentColor;fill-opacity:calc(var(--duo,.14) * var(--mu-duo-k,1));stroke:none}
@media (prefers-reduced-motion:no-preference){
.mu-life *{transition:transform var(--k-dur) var(--k-spring) var(--dl,0s),opacity .22s ease var(--dl,0s),fill-opacity .25s ease}
}
svg.mu-life .lL{transform-origin:12px 10.6px} svg.mu-life .lR{transform-origin:12px 8.8px;--dl:.06s}
@media (prefers-reduced-motion:no-preference){svg.mu-life:is(:hover,[data-state~="hover"]) .lL{animation:mu-il-plants 1s ease-in-out} svg.mu-life:is(:hover,[data-state~="hover"]) .lR{animation:mu-il-plants2 1s ease-in-out .06s} @keyframes mu-il-plants{35%{transform:rotate(-9deg)}70%{transform:rotate(4deg)}} @keyframes mu-il-plants2{35%{transform:rotate(9deg)}70%{transform:rotate(-4deg)}}}</style>
<path class="f" style="--duo:.12" d="M7.4 13.6h9.2l-1 5.6a1.4 1.4 0 0 1-1.4 1.2H9.8a1.4 1.4 0 0 1-1.4-1.2Z"/><path d="M6.4 13.6h11.2"/><path d="M12 13.6V8.8"/><path class="lL f" style="--duo:.22" d="M12 10.6c-.4-2.8-2.6-4.4-5.4-4.2.2 2.8 2.4 4.4 5.4 4.2Z"/><path class="lR f" style="--duo:.22" d="M12 8.8c.2-2.8 2.2-4.8 5.2-4.8 0 3-2.2 4.8-5.2 4.8Z"/>
</svg>
