<svg xmlns="http://www.w3.org/2000/svg" class="mu-life mu-il-presentation" width="24" height="24" viewBox="0 0 24 24">
<!-- MetalUI life icon: Presentation. Hover (or data-state="hover"): bars rise on the board. Reduced motion: static. -->
<style>
.mu-life{--sw:1.7;--k-spring:linear(0,0.0132,0.0492,0.1028,0.1692,0.2443,0.3247,0.4071,0.4892,0.5688,0.6445,0.715,0.7795,0.8374,0.8886,0.933,0.9707,1.0021,1.0274,1.0473,1.0623,1.0728,1.0795,1.0828,1.0835,1.0818,1.0784,1.0736,1.0679,1.0614,1.0547,1.0478,1.041,1.0344,1.0282,1.0224,1.0171,1.0124,1.0083,1.0047,1.0017,0.9992,0.9972,0.9957,1);--k-dur:.5s;flex:none;overflow:visible;fill:none;stroke:currentColor;stroke-width:var(--sw);stroke-linecap:round;stroke-linejoin:round}
.mu-life *{transform-box:view-box}
.mu-life .f{fill:currentColor;fill-opacity:calc(var(--duo,.14) * var(--mu-duo-k,1))}
.mu-life .s{fill:currentColor;stroke:none}
.mu-life .d{fill:currentColor;fill-opacity:calc(var(--duo,.14) * var(--mu-duo-k,1));stroke:none}
@media (prefers-reduced-motion:no-preference){
.mu-life *{transition:transform var(--k-dur) var(--k-spring) var(--dl,0s),opacity .22s ease var(--dl,0s),fill-opacity .25s ease}
}
svg.mu-life .b1{transform-origin:8px 12px} svg.mu-life .b2{transform-origin:12px 12px;--dl:.06s} svg.mu-life .b3{transform-origin:16px 12px;--dl:.12s}
@media (prefers-reduced-motion:no-preference){svg.mu-life:is(:hover,[data-state~="hover"]) .b1,svg.mu-life:is(:hover,[data-state~="hover"]) .b2,svg.mu-life:is(:hover,[data-state~="hover"]) .b3{animation:mu-il-presentation .5s cubic-bezier(.2,.7,.3,1) var(--dl) both} @keyframes mu-il-presentation{0%{transform:scaleY(0)}100%{transform:none}}}</style>
<rect class="f" style="--duo:.06" x="3.4" y="3.6" width="17.2" height="11.6" rx="2.4"/><path d="M12 15.2v3M8.4 20.4l3.6-2.2 3.6 2.2"/><path class="b1" d="M8 12V10"/><path class="b2" d="M12 12V7.4"/><path class="b3" d="M16 12V8.8"/>
</svg>
