<svg xmlns="http://www.w3.org/2000/svg" class="mu-life mu-il-rested" width="24" height="24" viewBox="0 0 24 24">
<!-- MetalUI life icon: Rested. Hover (or data-state="hover"): bars charge in turn. Reduced motion: static. -->
<style>
.mu-life{--sw:1.7;--k-spring:linear(0,0.0132,0.0492,0.1028,0.1692,0.2443,0.3247,0.4071,0.4892,0.5688,0.6445,0.715,0.7795,0.8374,0.8886,0.933,0.9707,1.0021,1.0274,1.0473,1.0623,1.0728,1.0795,1.0828,1.0835,1.0818,1.0784,1.0736,1.0679,1.0614,1.0547,1.0478,1.041,1.0344,1.0282,1.0224,1.0171,1.0124,1.0083,1.0047,1.0017,0.9992,0.9972,0.9957,1);--k-dur:.5s;flex:none;overflow:visible;fill:none;stroke:currentColor;stroke-width:var(--sw);stroke-linecap:round;stroke-linejoin:round}
.mu-life *{transform-box:view-box}
.mu-life .f{fill:currentColor;fill-opacity:calc(var(--duo,.14) * var(--mu-duo-k,1))}
.mu-life .s{fill:currentColor;stroke:none}
.mu-life .d{fill:currentColor;fill-opacity:calc(var(--duo,.14) * var(--mu-duo-k,1));stroke:none}
@media (prefers-reduced-motion:no-preference){
.mu-life *{transition:transform var(--k-dur) var(--k-spring) var(--dl,0s),opacity .22s ease var(--dl,0s),fill-opacity .25s ease}
}
svg.mu-life .b1{transform-origin:5.8px 12px} svg.mu-life .b2{transform-origin:9.7px 12px;--dl:.08s} svg.mu-life .b3{transform-origin:13.6px 12px;--dl:.16s}
@media (prefers-reduced-motion:no-preference){svg.mu-life:is(:hover,[data-state~="hover"]) .br{animation:mu-il-rested .5s cubic-bezier(.2,.7,.3,1) var(--dl) both} @keyframes mu-il-rested{0%{transform:scaleX(0)}100%{transform:none}}}</style>
<rect class="f" style="--duo:.06" x="3.2" y="7.4" width="15.6" height="9.2" rx="3"/><path d="M21 10.6v2.8"/><rect class="br b1 s" x="5.8" y="10" width="2.6" height="4" rx="1"/><rect class="br b2 s" x="9.7" y="10" width="2.6" height="4" rx="1"/><rect class="br b3 s" x="13.6" y="10" width="2.6" height="4" rx="1"/>
</svg>
