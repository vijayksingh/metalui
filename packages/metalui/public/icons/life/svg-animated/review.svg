<svg xmlns="http://www.w3.org/2000/svg" class="mu-life mu-il-review" width="24" height="24" viewBox="0 0 24 24">
<!-- MetalUI life icon: Review. Hover (or data-state="hover"): the tick redraws. Reduced motion: static. -->
<style>
.mu-life{--sw:1.7;--k-spring:linear(0,0.0132,0.0492,0.1028,0.1692,0.2443,0.3247,0.4071,0.4892,0.5688,0.6445,0.715,0.7795,0.8374,0.8886,0.933,0.9707,1.0021,1.0274,1.0473,1.0623,1.0728,1.0795,1.0828,1.0835,1.0818,1.0784,1.0736,1.0679,1.0614,1.0547,1.0478,1.041,1.0344,1.0282,1.0224,1.0171,1.0124,1.0083,1.0047,1.0017,0.9992,0.9972,0.9957,1);--k-dur:.5s;flex:none;overflow:visible;fill:none;stroke:currentColor;stroke-width:var(--sw);stroke-linecap:round;stroke-linejoin:round}
.mu-life *{transform-box:view-box}
.mu-life .f{fill:currentColor;fill-opacity:calc(var(--duo,.14) * var(--mu-duo-k,1))}
.mu-life .s{fill:currentColor;stroke:none}
.mu-life .d{fill:currentColor;fill-opacity:calc(var(--duo,.14) * var(--mu-duo-k,1));stroke:none}
@media (prefers-reduced-motion:no-preference){
.mu-life *{transition:transform var(--k-dur) var(--k-spring) var(--dl,0s),opacity .22s ease var(--dl,0s),fill-opacity .25s ease}
}
svg.mu-life .tk{stroke-dasharray:1 2}
@media (prefers-reduced-motion:no-preference){svg.mu-life:is(:hover,[data-state~="hover"]) .tk{animation:mu-il-review .4s cubic-bezier(.3,0,.2,1) .05s both} @keyframes mu-il-review{0%{stroke-dashoffset:1}100%{stroke-dashoffset:0}}}</style>
<defs><mask id="mu-life-review-m" maskUnits="userSpaceOnUse" x="0" y="0" width="24" height="24"><rect width="24" height="24" fill="#fff" stroke="none"/><circle cx="16.6" cy="16.6" r="5.5" fill="#000" stroke="none"/></mask></defs><g mask="url(#mu-life-review-m)"><rect x="4.6" y="3.4" width="11.4" height="17" rx="2.6"/><path d="M8 8h4.8M8 11.4h3"/></g><circle class="f" style="--duo:.2" cx="16.6" cy="16.6" r="3.9"/><path class="tk" pathLength="1" d="M14.9 16.7l1.2 1.2 2.3-2.5"/>
</svg>
