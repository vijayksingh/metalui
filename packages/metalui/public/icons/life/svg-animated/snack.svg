<svg xmlns="http://www.w3.org/2000/svg" class="mu-life mu-il-snack" width="24" height="24" viewBox="0 0 24 24">
<!-- MetalUI life icon: Snack. Hover (or data-state="hover"): cookie turns, a crumb falls. Reduced motion: static. -->
<style>
