@media (prefers-reduced-motion:no-preference){
.mu-life *{transition:transform var(--k-dur) var(--k-spring) var(--dl,0s),opacity .22s ease var(--dl,0s),fill-opacity .25s ease}
}
svg.mu-life .ck{transform-origin:11.2px 12.8px} svg.mu-life .cr{opacity:0}
@media (prefers-reduced-motion:no-preference){svg.mu-life:is(:hover,[data-state~="hover"]) .ck{transform:rotate(-14deg)} svg.mu-life:is(:hover,[data-state~="hover"]) .cr{animation:mu-il-snack .6s cubic-bezier(.3,0,.2,1) .08s} @keyframes mu-il-snack{0%{opacity:1;transform:none}100%{opacity:0;transform:translate(1.2px,6px)}}}</style>
