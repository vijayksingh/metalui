<svg xmlns="http://www.w3.org/2000/svg" class="mu-icon mu-ic-board" width="24" height="24" viewBox="0 0 24 24">
<!-- MetalUI icon: Board. Hover: The ribbon is lifted and let drop; its top edge catches it, the tail runs on and springs back.. Press (:active or data-state="press"): plays the same act. Reduced motion: static. -->
<style>
.mu-icon{--sw:1.7;--k-spring:linear(0,0.0117,0.0435,0.0909,0.1499,0.217,0.2892,0.3637,0.4386,0.512,0.5826,0.6494,0.7114,0.7683,0.8196,0.8654,0.9056,0.9403,0.9698,0.9944,1.0145,1.0305,1.0428,1.0518,1.0579,1.0616,1.0632,1.063,1.0615,1.0588,1.0554,1.0513,1.0468,1.0422,1.0374,1.0327,1.0282,1.0238,1.0198,1.0161,1.0127,1.0096,1.007,1.0046,1);--k-soft:linear(0,0.0063,0.0235,0.0493,0.0818,0.1194,0.1605,0.2042,0.2492,0.2949,0.3406,0.3856,0.4297,0.4723,0.5133,0.5525,0.5898,0.625,0.6581,0.6892,0.7181,0.745,0.77,0.793,0.8142,0.8337,0.8515,0.8678,0.8826,0.896,0.9082,0.9192,0.9291,0.938,0.9459,0.953,0.9594,0.965,0.97,0.9745,0.9784,0.9818,0.9848,0.9874,1);--k-dur:.46s;flex:none;overflow:visible;fill:none;stroke:currentColor;stroke-width:var(--sw);stroke-linecap:round;stroke-linejoin:round}
.mu-icon *{transform-box:view-box}
.mu-icon .f{fill:currentColor;fill-opacity:calc(var(--duo,.14) * var(--mu-duo-k,1))}
.mu-icon .s{fill:currentColor;stroke:none}
.mu-icon .d{fill:currentColor;fill-opacity:calc(var(--duo,.14) * var(--mu-duo-k,1));stroke:none}
@media (prefers-reduced-motion:no-preference){
.mu-icon *{transition:transform var(--k-dur) var(--k-spring) var(--dl,0s),opacity .2s ease var(--dl,0s),d var(--k-dur) var(--k-spring) var(--dl,0s),stroke-dashoffset var(--k-dur) var(--k-spring) var(--dl,0s),fill-opacity .2s ease}
}
svg.mu-icon [data-part="ribbon"]{transform-origin:12px 3.8px}svg.mu-icon [data-part="catch"]{transform-origin:12px 4.4px}
@media (prefers-reduced-motion:no-preference){svg.mu-icon:is(:hover,:focus-visible,[data-state~="play"]) [data-part="ribbon"]{animation:mu-board-ribbon 776ms linear both}@keyframes mu-board-ribbon{0%{transform:translate(0px,0px) rotate(0deg) scale(1,1);animation-timing-function:cubic-bezier(.4,0,.2,1)}23.196%{transform:translate(0px,-1.6px) rotate(0deg) scale(1,0.96);animation-timing-function:cubic-bezier(.4,0,.2,1)}33.505%{transform:translate(0px,-1.7px) rotate(0deg) scale(1,0.96);animation-timing-function:cubic-bezier(.55,0,.85,.45)}46.392%{transform:translate(0px,0.5px) rotate(0deg) scale(1,1);animation-timing-function:cubic-bezier(.4,0,.2,1)}54.124%{transform:translate(0px,0.5px) rotate(0deg) scale(1,1.05);animation-timing-function:cubic-bezier(.37,0,.63,1)}100%{transform:translate(0px,0px) rotate(0deg) scale(1,1)}}svg.mu-icon:is(:hover,:focus-visible,[data-state~="play"]) [data-part="catch"]{animation:mu-board-catch 776ms linear both}@keyframes mu-board-catch{0%{transform:scale(.7);opacity:0}45.103%{transform:scale(.7);opacity:0;animation-timing-function:cubic-bezier(.22,1,.36,1)}51.546%{transform:scale(1);opacity:1;animation-timing-function:cubic-bezier(.4,0,.2,1)}79.897%{transform:scale(1.2);opacity:0}100%{transform:scale(.7);opacity:0}}}</style>
<path data-part="ribbon" class="f" style="--duo:.16" d="M6.8 19.8V5.9a2.1 2.1 0 0 1 2.1-2.1h6.2a2.1 2.1 0 0 1 2.1 2.1v13.9l-4.3-3a1.6 1.6 0 0 0-1.8 0Z"/><path class="ac" data-part="catch" opacity="0" d="M5.3 4.4h-1.3M18.7 4.4h1.3" style="stroke-width:calc(var(--sw) * .7)"/>
