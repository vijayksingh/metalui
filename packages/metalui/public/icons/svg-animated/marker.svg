@media (prefers-reduced-motion:no-preference){svg.mu-icon .band{transition:transform .46s var(--k-spring)} svg.mu-icon .mk{transition:transform .46s var(--k-spring)} svg.mu-icon:is(:hover,[data-state~="hover"]) .band{transform:scaleX(1)} svg.mu-icon:is(:hover,[data-state~="hover"]) .mk{transform:translateX(3.4px)} svg.mu-icon:is(:active,[data-state~="press"]) .mk{animation:mk-p .32s cubic-bezier(.3,0,.2,1)} @keyframes mk-p{40%{transform:translate(.4px,.6px) rotate(-3deg)}}}</style>
