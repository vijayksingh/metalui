<svg xmlns="http://www.w3.org/2000/svg" class="mu-icon mu-ic-marker" width="24" height="24" viewBox="0 0 24 24">
<!-- MetalUI icon: Marker. Hover: slides on and the band grows under it. Press (:active or data-state="press"): the chisel tip presses. Reduced motion: static. -->
