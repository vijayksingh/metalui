@media (prefers-reduced-motion:no-preference){svg.mu-icon:is(:hover,[data-state~="hover"]) .pn{transform:translateY(-1.3px) rotate(8deg)} svg.mu-icon:is(:hover,[data-state~="hover"]) .sh{opacity:.12;transform:scaleX(.6)} svg.mu-icon:is(:active,[data-state~="press"]) .pn{animation:pin-p .34s cubic-bezier(.3,0,.2,1)} svg.mu-icon:is(:active,[data-state~="press"]) .sh{animation:pin-s .34s cubic-bezier(.3,0,.2,1)} @keyframes pin-p{40%{transform:translateY(.7px)}} @keyframes pin-s{40%{opacity:.5;transform:scaleX(1.25)}}}</style>
