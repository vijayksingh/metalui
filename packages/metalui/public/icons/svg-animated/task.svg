<svg xmlns="http://www.w3.org/2000/svg" class="mu-icon mu-ic-task" width="24" height="24" viewBox="0 0 24 24">
<!-- MetalUI icon: Task. Hover: The box is pressed down; while it is held the tick is written, and released it springs back up with a click.. Press (:active or data-state="press"): plays the same act. Reduced motion: static. -->
