<svg xmlns="http://www.w3.org/2000/svg" class="mu-icon mu-ic-task" width="24" height="24" viewBox="0 0 24 24">
<!-- MetalUI icon: Task. Hover: the tick nods yes inside its box. Press (:active or data-state="press"): the box presses in and comes back up ticked. Reduced motion: static. -->
<style>
