.mu-icon *{transform-box:view-box}
.mu-icon .f{fill:currentColor;fill-opacity:calc(var(--duo,.14) * var(--mu-duo-k,1))}
.mu-icon .s{fill:currentColor;stroke:none}
.mu-icon .d{fill:currentColor;fill-opacity:calc(var(--duo,.14) * var(--mu-duo-k,1));stroke:none}
@media (prefers-reduced-motion:no-preference){
.mu-icon *{transition:transform var(--k-dur) var(--k-spring) var(--dl,0s),opacity .2s ease var(--dl,0s),d var(--k-dur) var(--k-spring) var(--dl,0s),stroke-dashoffset var(--k-dur) var(--k-spring) var(--dl,0s),fill-opacity .2s ease}
}
svg.mu-icon .tk{stroke-dasharray:1 2} svg.mu-icon .nd{transform-origin:11px 14.5px} svg.mu-icon .tb{transform-origin:12px 12px}
@media (prefers-reduced-motion:no-preference){svg.mu-icon:is(:hover,[data-state~="hover"]) .nd{animation:tk-nod .52s cubic-bezier(.3,0,.3,1)} svg.mu-icon:is(:active,[data-state~="press"]) .tb{animation:tk-box .38s cubic-bezier(.3,0,.2,1)} svg.mu-icon:is(:active,[data-state~="press"]) .tk{animation:tk-p .3s cubic-bezier(.3,.1,.2,1) both} svg.mu-icon:is(:active,[data-state~="press"]) .tk{animation-delay:.08s} @keyframes tk-nod{27%{transform:rotate(6deg)}62%{transform:rotate(-2.5deg)}} @keyframes tk-box{32%{transform:scale(.94)}} @keyframes tk-p{0%{stroke-dashoffset:1}100%{stroke-dashoffset:0}}}</style>
